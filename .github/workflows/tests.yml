name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  netbox-tests:
    name: NetBox ${{ matrix.netbox.version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        netbox:
          - version: "4.5.10"
            ref: b78bd713294564e0421c36c936a909e64da04b8d
          - version: "4.6.10"
            ref: 560da79ea1213a0b8bbc9ecf4ac03714fa2071d7
          - version: "4.7.0"
            ref: 5f06007e4c9bacc93ce17c1e645fc1143d60df3d
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netbox -d netbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out NetBox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox.ref }}
          path: netbox-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: netbox-source/requirements.txt

      - name: Install NetBox and plugin dependencies
        run: |
          python -m pip install -r netbox-source/requirements.txt
          python -m pip install .

      - name: Run plugin tests
        env:
          NETBOX_CONFIGURATION: testing_configuration
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/netbox-source/netbox
        run: python netbox-source/netbox/manage.py test netbox_ai_navigator.tests --verbosity 2
