name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  netbox-tests:
    name: NetBox 4.6 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netbox -d netbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out NetBox
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: netbox-community/netbox
          ref: f8b00e9aae7fab01dae1bb15ec85b95d1ba7c127 # v4.6.9
          path: netbox-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: netbox-source/requirements.txt

      - name: Install NetBox and plugin dependencies
        run: |
          python -m pip install -r netbox-source/requirements.txt
          python -m pip install .

      - name: Run plugin tests
        env:
          NETBOX_CONFIGURATION: testing_configuration
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/netbox-source/netbox
        run: python netbox-source/netbox/manage.py test netbox_ai_navigator.tests --verbosity 2
